<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Sempre — A nossa história</title>
<meta name="description" content="Crie um espaço digital para guardar a história de vocês.">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#211d1b;--muted:#756c67;--line:#e7dfda;--accent:#8b5961;--accent2:#c9969d;--soft:#f1e5e5;--shadow:0 20px 60px rgba(45,27,22,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.nav{height:72px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#faf8f5ee;backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}.brand{font:700 25px Georgia,serif}.nav small{color:var(--muted)}.hero{min-height:calc(100vh - 72px);display:grid;place-items:center;text-align:center;padding:70px 6%;background:radial-gradient(circle at 82% 18%,#f0dfe1 0,transparent 31%),radial-gradient(circle at 15% 72%,#eee5d9 0,transparent 28%)}.hero-inner{max-width:900px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:12px;color:var(--accent);font-weight:800}.hero h1{font:700 clamp(48px,8vw,88px)/.98 Georgia,serif;margin:20px 0}.hero p{max-width:700px;margin:0 auto 30px;color:var(--muted);font-size:19px;line-height:1.7}.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:750;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--ink);color:white}.secondary{background:#fff;border:1px solid var(--line);margin-left:8px}.section{max-width:1180px;margin:auto;padding:85px 6%}.section h2{font:700 42px Georgia,serif;margin:0 0 10px}.section>p{color:var(--muted);line-height:1.7;max-width:680px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:27px;box-shadow:var(--shadow)}.card h3{font:700 23px Georgia,serif}.card p{color:var(--muted);line-height:1.6}.icon{font-size:28px}.demo{background:#eee5df}.couple{max-width:950px;margin:30px auto 0;background:#fff;border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}.cover{min-height:350px;display:grid;place-items:center;text-align:center;color:#fff;padding:35px;background:linear-gradient(135deg,#d3b1b4,#5c4544)}.cover h2{font:700 60px Georgia,serif;margin:10px}.content{padding:34px}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 35px}.count div{background:var(--bg);padding:18px;border-radius:16px;text-align:center}.count b{font-size:29px}.timeline{border-left:2px solid var(--line);padding-left:24px}.event{margin:22px 0}.event b{font-size:12px;letter-spacing:1px;color:var(--accent)}.pricing{background:#211d1b;color:white}.pricing .section>p{color:#cfc6c1}.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.price{background:#2b2623;border:1px solid #473d38;border-radius:24px;padding:28px}.price.featured{background:#fff;color:#211d1b}.price strong{font-size:38px}.price ul{line-height:2;color:#cfc6c1;padding-left:20px}.featured ul{color:#665e59}.price .btn{width:100%;margin-top:12px}.hidden{display:none!important}.builder-wrap{min-height:100vh;padding:38px 6%;background:linear-gradient(135deg,#faf8f5,#f2e8e6)}.builder{max-width:1100px;margin:auto}.builder-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.back{border:0;background:transparent;color:var(--muted)}.steps{display:flex;gap:8px;margin-bottom:18px}.step{height:5px;flex:1;border-radius:5px;background:#ddd}.step.active{background:var(--accent)}.builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px}.preview{background:#211d1b;color:white;border-radius:26px;padding:18px;min-height:580px;position:sticky;top:95px}.preview-inner{height:100%;min-height:544px;border-radius:18px;overflow:hidden;background:#fff;color:var(--ink)}.preview-cover{height:240px;display:grid;place-items:center;text-align:center;padding:20px;color:#fff}.preview-cover h2{font:700 40px Georgia,serif;margin:7px}.preview-body{padding:22px}.field{margin:0 0 17px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.field textarea{min-height:105px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.upload{border:1.5px dashed #cfc4bf;border-radius:15px;padding:18px;text-align:center;color:var(--muted)}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.thumbs img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}.public{min-height:100vh;background:var(--bg)}.public-nav{padding:20px 6%;display:flex;justify-content:space-between}.public-page{max-width:950px;margin:auto;padding:15px 6% 70px}.public-hero{min-height:500px;border-radius:34px;display:grid;place-items:center;text-align:center;color:#fff;padding:35px;box-shadow:var(--shadow)}.public-hero h1{font:700 clamp(48px,8vw,80px)/1 Georgia,serif;margin:10px 0}.public-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;margin-top:20px}.public-card h2{font:700 34px Georgia,serif}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.success{text-align:center;max-width:650px;margin:100px auto;padding:30px}.success .big{font-size:60px}.toast{position:fixed;right:20px;bottom:20px;background:#211d1b;color:#fff;padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);z-index:30}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modal-box{background:#fff;border-radius:24px;padding:28px;max-width:500px;width:100%}.pay-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-option{border:1px solid var(--line);padding:15px;border-radius:14px;background:white;text-align:left}.pay-option strong{display:block}.muted{color:var(--muted)}footer{text-align:center;padding:40px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:800px){.grid,.price-grid,.builder-grid{grid-template-columns:1fr}.preview{position:static}.secondary{margin:10px 0 0}.count{grid-template-columns:repeat(2,1fr)}.cover h2{font-size:42px}.gallery{grid-template-columns:repeat(2,1fr)}.nav small{display:none}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='para-sempre-v5';
const REF=new URLSearchParams(location.search).get('ref')||'';
const defaultStory={name1:'',name2:'',date:'',phrase:'A nossa história merece um lugar só nosso.',message:'',music:'',theme:'rose',events:[],photos:[],plan:'memorias',planPrice:599,storyId:null,slug:null,editToken:null,orderId:null};
let story=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultStory); let step=1;
const themes={rose:['#c9989e','#5c4143'],cream:['#cbb79c','#5c5044'],night:['#514a61','#17151b']};
function save(){localStorage.setItem(KEY,JSON.stringify(story));}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function initials(){return (story.name1[0]||'')+(story.name2[0]||'');}
function diff(){if(!story.date)return null;let a=new Date(story.date+'T00:00:00'),b=new Date();let days=Math.max(0,Math.floor((b-a)/86400000));return {days,years:Math.floor(days/365.2425),months:Math.floor((days%365.2425)/30.44),rest:Math.floor(days%30.44)};}
async function api(path,opt={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(story.editToken?{'Authorization':'Bearer '+story.editToken}:{}),...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||d.message||'Erro de servidor');return d;}
async function ensureRemote(){if(story.storyId)return true;const d=await api('/api/stories',{method:'POST',body:JSON.stringify({name1:story.name1,name2:story.name2,startDate:story.date,phrase:story.phrase,message:story.message,music:story.music,theme:story.theme,plan:story.plan})});Object.assign(story,{storyId:d.id,slug:d.slug,editToken:d.editToken});save();return true;}
async function syncStory(){if(!story.storyId)return;await api('/api/stories/'+story.storyId,{method:'PUT',body:JSON.stringify({name1:story.name1,name2:story.name2,startDate:story.date,phrase:story.phrase,message:story.message,music:story.music,theme:story.theme,plan:story.plan,events:story.events})});}
async function render(){const path=location.pathname; if(path.startsWith('/s/')){const slug=decodeURIComponent(path.slice(3));try{const d=await fetch('/api/public/story/'+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw new Error();return r.json()});document.getElementById('app').innerHTML=remotePublic(d);return}catch(e){document.getElementById('app').innerHTML='<div class="success"><div class="big">♡</div><h1>História não encontrada.</h1><p class="muted">Este link pode ainda não estar publicado.</p></div>';return;}}
document.getElementById('app').innerHTML=step==='success'?successPage():step===0?home():builder();}
function home(){return `<nav class="nav"><div class="brand">Para Sempre.</div><small>Um lugar para a vossa história</small></nav><section class="hero"><div class="hero-inner"><div class="eyebrow">Memórias que ficam</div><h1>Este não é um site.<br>É a nossa história.</h1><p>Crie uma página única para guardar os momentos, palavras, fotografias e datas que fizeram vocês chegar até aqui.</p><button class="btn primary" onclick="start('memorias',599)">Criar a nossa história ❤️</button><button class="btn secondary" onclick="document.getElementById('demo').scrollIntoView()">Ver exemplo</button></div></section><section class="section"><h2>Mais do que fotografias.</h2><p>Um espaço digital feito para celebrar uma relação hoje e poder voltar a ela daqui a muitos anos.</p><div class="grid">${[['⏳','O vosso tempo','Contador automático desde o dia em que tudo começou.'],['📖','Linha do tempo','Os momentos importantes organizados como capítulos.'],['🎵','A vossa música','Uma música ou ligação que tenha significado para vocês.'],['💌','Carta privada','Uma mensagem especial para ficar guardada.'],['🔐','Cápsula do tempo','Uma promessa para abrir numa data futura.'],['▣','QR exclusivo','O link da vossa história pode virar um presente físico.']].map(x=>`<article class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></section><section id="demo" class="section demo"><h2>Uma página que parece feita só para vocês.</h2><p>O cliente cria tudo sem programar.</p><div class="couple"><div class="cover"><div><div>H & Y</div><h2>Hélder & Yuna</h2><div>Desde 18 de Outubro de 2022</div></div></div><div class="content"><h2 style="font-family:Georgia,serif">O nosso tempo juntos</h2><div class="count"><div><b>4</b><br>Anos</div><div><b>11</b><br>Meses</div><div><b>19</b><br>Dias</div><div><b>∞</b><br>Momentos</div></div></div></div></section><section class="pricing"><div class="section"><h2>Escolham a experiência.</h2><p>Preços de lançamento.</p><div class="price-grid">${[['Love','299','Página, contador, mensagem e fotos'],['Memórias','599','Linha do tempo, fotos, música e mais'],['Forever','999','Personalização, QR e experiência completa']].map((p,i)=>`<div class="price ${i===1?'featured':''}"><h3>${p[0]}</h3><strong>${p[1]} MT</strong><ul><li>${p[2]}</li><li>Link exclusivo</li><li>Página responsiva</li></ul><button class="btn primary" onclick="start('${['love','memorias','forever'][i]}',${p[1]})">Começar</button></div>`).join('')}</div></div></section><footer>Para Sempre. — Não oferecemos páginas. Guardamos histórias.</footer>`}
function start(plan='memorias',price=599){story.plan=plan;story.planPrice=price;step=1;save();render();}
function builder(){let d=diff();return `<div class="builder-wrap"><div class="builder"><div class="builder-top"><button class="back" onclick="step=0;render()">← Voltar</button><b>Para Sempre.</b><span>${step}/4</span></div><div class="steps">${[1,2,3,4].map(i=>`<span class="step ${i<=step?'active':''}"></span>`).join('')}</div><div class="builder-grid"><div class="form">${stepForm()}</div><div class="preview"><div class="preview-inner"><div class="preview-cover" style="background:linear-gradient(135deg,${themes[story.theme][0]},${themes[story.theme][1]})"><div><div>${esc(initials())}</div><h2>${esc(story.name1||'Vocês')} & ${esc(story.name2||'dois')}</h2><div>${story.date?new Date(story.date+'T00:00:00').toLocaleDateString('pt-MZ',{day:'2-digit',month:'long',year:'numeric'}):'A vossa data'}</div></div></div><div class="preview-body"><b>${esc(story.phrase||'A nossa história merece um lugar só nosso.')}</b>${d?`<p class="muted">Juntos há <b>${d.days}</b> dias.</p>`:''}<p>${esc(story.message||'A mensagem especial aparecerá aqui.')}</p></div></div></div></div></div></div>`}
function field(label,key,type='text'){return `<div class="field"><label>${label}</label><input type="${type}" value="${esc(story[key]||'')}" oninput="story.${key}=this.value;save();updatePreview()"></div>`}
function stepForm(){if(step===1)return `<h2>Vamos começar.</h2><p class="muted">Conte-nos quem faz parte desta história.</p><div class="row">${field('Nome','name1')}${field('Nome','name2')}</div>${field('Data em que tudo começou','date','date')}${field('Frase do casal','phrase')}<div class="field"><label>Estilo</label><select onchange="story.theme=this.value;save();render()"><option value="rose" ${story.theme==='rose'?'selected':''}>Romântico</option><option value="cream" ${story.theme==='cream'?'selected':''}>Elegante</option><option value="night" ${story.theme==='night'?'selected':''}>Noite</option></select></div><div class="actions"><span></span><button class="btn primary" onclick="next()">Continuar →</button></div>`;if(step===2)return `<h2>As memórias.</h2><p class="muted">Escolha até 8 fotografias.</p><div class="upload"><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="handlePhotos(this.files)"><p>Escolher fotos</p></div><div class="thumbs">${story.photos.map(p=>`<img src="${esc(p)}">`).join('')}</div><div class="actions"><button class="btn secondary" onclick="step=1;render()">← Voltar</button><button class="btn primary" onclick="next()">Continuar →</button></div>`;if(step===3)return `<h2>O coração da página.</h2><p class="muted">Escreva algo que só vocês entenderiam.</p><div class="field"><label>Mensagem especial</label><textarea oninput="story.message=this.value;save();updatePreview()">${esc(story.message)}</textarea></div>${field('Nossa música (nome ou link)','music')}<div class="field"><label>Primeiro momento da linha do tempo</label><input id="eventText" placeholder="Ex.: O nosso primeiro encontro"></div><div class="actions"><button class="btn secondary" onclick="step=2;render()">← Voltar</button><button class="btn primary" onclick="addEvent()">Adicionar & continuar →</button></div>`;return `<h2>Está a nascer.</h2><p class="muted">Revise e publique a vossa história.</p><div class="panel"><b>${esc(story.name1||'Nome')} & ${esc(story.name2||'Nome')}</b><p>${esc(story.phrase)}</p><p>${story.photos.length} foto(s) · ${story.events.length} momento(s)</p><hr><h3>${story.planPrice} MT</h3><p class="muted">A publicação só acontece depois da confirmação real do pagamento.</p></div><div class="actions"><button class="btn secondary" onclick="step=3;render()">← Voltar</button><button class="btn primary" onclick="openPayment()">Publicar e pagar</button></div>`}
async function next(){try{if(step===1){if(!story.name1||!story.name2)return alert('Coloque os dois nomes.');await ensureRemote();await syncStory();}step++;render()}catch(e){alert(e.message)}}
async function addEvent(){let t=document.getElementById('eventText').value.trim();if(t)story.events.push({date:new Date().toISOString().slice(0,10),text:t});save();try{await syncStory();step=4;render()}catch(e){alert(e.message)}}
async function handlePhotos(files){if(!story.storyId)await ensureRemote();const arr=[...files].slice(0,8);for(const f of arr){if(f.size>3*1024*1024){alert('Cada foto deve ter no máximo 3 MB.');continue}const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});try{const d=await api('/api/stories/'+story.storyId+'/photos',{method:'POST',body:JSON.stringify({dataUrl:data})});story.photos.push(d.url);save();render()}catch(e){alert(e.message)}}}
function updatePreview(){const el=document.querySelector('.preview-body');if(el){let d=diff();el.innerHTML=`<b>${esc(story.phrase||'A nossa história merece um lugar só nosso.')}</b>${d?`<p class="muted">Juntos há <b>${d.days}</b> dias.</p>`:''}<p>${esc(story.message||'A mensagem especial aparecerá aqui.')}</p>`}}
function openPayment(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="pay"><div class="modal-box"><h2>Finalizar ${story.planPrice} MT</h2><p class="muted">Escolha o método. O pagamento real será confirmado pelo servidor.</p><div class="pay-options"><button class="pay-option" onclick="pay('MPESA')"><strong>📱 M-Pesa</strong>Pagamento móvel</button><button class="pay-option" onclick="pay('EMOLA')"><strong>📱 e-Mola</strong>Pagamento móvel</button><button class="pay-option" onclick="pay('CARD')"><strong>💳 Cartão</strong>Se disponível no checkout</button></div><div class="field" style="margin-top:15px"><label>Número de telefone (M-Pesa/e-Mola)</label><input id="payphone" placeholder="25884..." inputmode="tel"></div><button class="btn secondary" style="width:100%;margin:15px 0 0" onclick="document.getElementById('pay').remove()">Cancelar</button></div></div>`)}
async function pay(method){try{if(!story.storyId)await ensureRemote();await syncStory();const phone=document.getElementById('payphone')?.value.trim();document.getElementById('pay').remove();const d=await api('/api/orders/'+story.storyId,{method:'POST',body:JSON.stringify({plan:story.plan,method,phone})});story.orderId=d.orderId;save();if(d.checkoutUrl)location.href=d.checkoutUrl;else {step='success';render();pollOrder();}}catch(e){alert(e.message)}}
async function pollOrder(){if(!story.orderId)return;for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,5000));try{const o=await api('/api/orders/'+story.orderId,{headers:{Authorization:''}});if(o.status==='PAID'){location.href='/s/'+encodeURIComponent(story.slug);return}if(['FAILED','CANCELLED'].includes(o.status)){document.querySelector('.success p').textContent='O pagamento não foi concluído. Pode tentar novamente.';return}}catch{}}}
function successPage(){return `<div class="success"><div class="big">❤️</div><h1>Pagamento iniciado.</h1><p>Estamos à espera da confirmação do gateway. Não feche esta página. Quando o pagamento for confirmado, a vossa história será publicada.</p><div class="panel"><b>${esc(story.name1)} & ${esc(story.name2)}</b><p class="muted">${story.planPrice} MT · ${esc(story.slug||'')}</p></div><button class="btn secondary" onclick="location.href='/'">Voltar ao início</button></div>`}
function remotePublic(s){let d=s.start_date?Math.max(0,Math.floor((Date.now()-new Date(s.start_date+'T00:00:00'))/86400000)):null;let years=d!=null?Math.floor(d/365.2425):0;let months=d!=null?Math.floor((d%365.2425)/30.44):0;let rest=d!=null?Math.floor(d%30.44):0;return `<div class="public"><div class="public-nav"><b>Para Sempre.</b><span class="muted">Uma história para guardar.</span></div><main class="public-page"><section class="public-hero" style="background:linear-gradient(135deg,${themes[s.theme]?.[0]||themes.rose[0]},${themes[s.theme]?.[1]||themes.rose[1]})"><div><div>${esc((s.name1[0]||'')+(s.name2[0]||''))}</div><h1>${esc(s.name1)} & ${esc(s.name2)}</h1><p>${s.start_date?'Desde '+new Date(s.start_date+'T00:00:00').toLocaleDateString('pt-MZ',{day:'numeric',month:'long',year:'numeric'}):''}</p><p>${esc(s.phrase||'')}</p></div></section>${d!=null?`<section class="public-card"><h2>O nosso tempo juntos</h2><div class="count"><div><b>${years}</b><br>Anos</div><div><b>${months}</b><br>Meses</div><div><b>${rest}</b><br>Dias</div><div><b>${d}</b><br>Total</div></div></section>`:''}<section class="public-card"><h2>Uma mensagem para você</h2><p>${esc(s.message||'')}</p>${s.music?`<p>🎵 <b>Nossa música:</b> ${esc(s.music)}</p>`:''}</section>${s.photos?.length?`<section class="public-card"><h2>As nossas memórias</h2><div class="gallery">${s.photos.map(p=>`<img src="${esc(p.url)}" loading="lazy">`).join('')}</div></section>`:''}<section class="public-card"><h2>A nossa história</h2>${s.events?.length?s.events.map(e=>`<div class="event"><b>${esc(e.event_date||'')}</b><p>${esc(e.title||'')}</p></div>`).join(''):'<p class="muted">Os momentos importantes aparecerão aqui.</p>'}</section></main></div>`}
render();
</script>
</body></html>
